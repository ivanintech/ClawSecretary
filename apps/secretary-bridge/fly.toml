# Fly.io deployment configuration for SecretaryOS Bridge Server

app = "secretaryos-bridge"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3001"

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[deploy]
release_command = "node dist/index.js"

[[services]]
protocol = "tcp"
internal_port = 3001

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[services]]
protocol = "tcp"
internal_port = 3001

  [[services.ports]]
    port = 10001
